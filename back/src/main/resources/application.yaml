spring:
  application:
    name: movie_ranger
  devtools:
    livereload:
      enabled: true
    # 1. 데이터베이스 접속 설정 (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/movie_power?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
    username: root
    password: '1234'

  jpa:
    hibernate:
        # update: 엔티티 수정 시 테이블 구조를 자동으로 반영
        # create: 서버 켤 때마다 테이블을 다 밀고 새로 생성
      ddl-auto: update
      show-sql: true           # 콘솔에 실행 SQL 출력
    properties:
      hibernate:
        format_sql: true     # SQL을 가독성 좋게 정렬
        dialect: org.hibernate.dialect.MySQLDialect        #방언 설정

  logging:
    level:
      org.hibernate.SQL: debug              # 실행 SQL 로그 레벨
      org.hibernate.orm.jdbc.bind: trace    # SQL에 담긴 실제 파라미터(값) 확인

  tmdb:
    api:
      key: ${VITE_REACT_APP_MOVIE_API_KEY}


  server:
    port: 8080
    servlet:
      session:
        timeout: 30m

file:
  upload:
    # 최상위 루트 경로 (저장용)
    baseLocation: C:/movie/
    # 최상위 루트 경로 (WebMvcConfig 설정용)
    baseResourceLocation: file:///C:/movie/

    # 각 카테고리별 하위 폴더명
    profileDir: profile